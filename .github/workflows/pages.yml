# Deploy situs statis ke GitHub Pages.
# `configure-pages` dengan enablement: true sekalian MENGAKTIFKAN Pages,
# jadi tidak perlu klik apa pun di Settings.
name: Deploy ke GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Satu deploy sekaligus; jangan batalkan deploy yang sedang jalan
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Siapkan (dan aktifkan) Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Situs adalah repo itu sendiri: statis, tanpa build step
      - name: Unggah artifact situs
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
