<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Laras eskrim">
  <defs>
    <linearGradient id="eskrim-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD9E8"/>
      <stop offset=".42" stop-color="#F7A8C4"/>
      <stop offset="1" stop-color="#E8739F"/>
    </linearGradient>
    <linearGradient id="eskrim-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFF0C2"/>
      <stop offset=".5" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#FFF0C2"/>
    </linearGradient>
  </defs>

  <!-- laras utama, perspektif 3/4: sempit di ujung jauh, lebar di dekat pemain -->
  <path d="M80 30 L120 30 L149 160 L59 160 Z" fill="url(#eskrim-body)"/>
  <!-- garis sorot kiri (arah lampu kios) -->
  <path d="M80 30 L88 30 L104 160 L88 160 Z" fill="#FFF4DC" opacity=".16"/>
  <!-- bayangan kanan -->
  <path d="M116 30 L120 30 L149 160 L136 160 Z" fill="#000" opacity=".22"/>

  <!-- moncong kuningan lebar -->
  <path d="M68 8 L132 8 L128 36 L72 36 Z" fill="url(#eskrim-metal)"/>
  <ellipse cx="100" cy="11" rx="30" ry="6" fill="#FFE08A"/>
  <ellipse cx="100" cy="11" rx="15" ry="4" fill="#1B1206"/>
  <rect x="70" y="30" width="60" height="5" rx="2" fill="#000" opacity=".22"/>

  <!-- pita warna-warni terikat di laras -->
  <path d="M84 74 q-19 9 -25 25 q13 -5 21 -16 z" fill="#43C6B7"/>
  <path d="M116 74 q19 9 25 25 q-13 -5 -21 -16 z" fill="#F5A524"/>
  <rect x="82" y="68" width="36" height="9" rx="4" fill="#43C6B7"/>
  <rect x="82" y="68" width="18" height="9" rx="4" fill="#F5A524"/>

  <!-- badan dekat pemain + pelatuk -->
  <path d="M62 132 L138 132 L149 160 L59 160 Z" fill="#000" opacity=".18"/>
  <rect x="86" y="120" width="28" height="12" rx="5" fill="url(#eskrim-metal)" opacity=".9"/>
  <circle cx="92" cy="52" r="11" fill="#FFF4DC"/>
  <circle cx="110" cy="58" r="10" fill="#8B7FD4"/>
  <circle cx="98" cy="70" r="10" fill="#43C6B7"/>
  <path d="M84 92 L116 92 L112 112 L88 112 Z" fill="#E0B04A" opacity=".85"/>
  <circle cx="100" cy="44" r="4" fill="#D93A3A"/>
</svg>
