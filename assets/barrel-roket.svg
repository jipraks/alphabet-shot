<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 160" preserveAspectRatio="xMidYMax meet" role="img" aria-label="Laras roket">
  <defs>
    <linearGradient id="roket-body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9D4E8"/>
      <stop offset=".42" stop-color="#8FA0BF"/>
      <stop offset="1" stop-color="#5A6C8C"/>
    </linearGradient>
    <linearGradient id="roket-metal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D93A3A"/>
      <stop offset=".5" stop-color="#FF8C1A"/>
      <stop offset="1" stop-color="#D93A3A"/>
    </linearGradient>
  </defs>

  <!-- laras utama, perspektif 3/4: sempit di ujung jauh, lebar di dekat pemain -->
  <path d="M80 30 L120 30 L149 160 L59 160 Z" fill="url(#roket-body)"/>
  <!-- garis sorot kiri (arah lampu kios) -->
  <path d="M80 30 L88 30 L104 160 L88 160 Z" fill="#FFF4DC" opacity=".16"/>
  <!-- bayangan kanan -->
  <path d="M116 30 L120 30 L149 160 L136 160 Z" fill="#000" opacity=".22"/>

  <!-- moncong kuningan lebar -->
  <path d="M68 8 L132 8 L128 36 L72 36 Z" fill="url(#roket-metal)"/>
  <ellipse cx="100" cy="11" rx="30" ry="6" fill="#FF8C1A"/>
  <ellipse cx="100" cy="11" rx="15" ry="4" fill="#1B1206"/>
  <rect x="70" y="30" width="60" height="5" rx="2" fill="#000" opacity=".22"/>

  <!-- pita warna-warni terikat di laras -->
  <path d="M84 74 q-19 9 -25 25 q13 -5 21 -16 z" fill="#4FA3E3"/>
  <path d="M116 74 q19 9 25 25 q-13 -5 -21 -16 z" fill="#FFC93C"/>
  <rect x="82" y="68" width="36" height="9" rx="4" fill="#4FA3E3"/>
  <rect x="82" y="68" width="18" height="9" rx="4" fill="#FFC93C"/>

  <!-- badan dekat pemain + pelatuk -->
  <path d="M62 132 L138 132 L149 160 L59 160 Z" fill="#000" opacity=".18"/>
  <rect x="86" y="120" width="28" height="12" rx="5" fill="url(#roket-metal)" opacity=".9"/>
  <path d="M76 96 L64 132 L86 122 Z" fill="#D93A3A"/>
  <path d="M124 96 L136 132 L114 122 Z" fill="#D93A3A"/>
  <circle cx="100" cy="60" r="9" fill="#4FA3E3"/>
  <circle cx="100" cy="60" r="5" fill="#16173A" opacity=".55"/>
  <rect x="84" y="84" width="32" height="4" rx="2" fill="#D93A3A"/>
</svg>
